<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Only this site's own scripts and styles; connections only to Spotify; the song preview player only from Spotify.
       This protects the Spotify login kept in the browser: no script from elsewhere can run on these pages. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.spotify.com https://accounts.spotify.com; frame-src https://open.spotify.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Dance Playlist Generator</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/generator/page/generator-page.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Dance Playlist Generator</h1>
    <p class="tagline">Random social-dance playlists that follow your rules.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="settings-heading">
      <h2 id="settings-heading">Settings</h2>
      <div id="settings-bar"></div>
      <div id="library"></div>
      <form id="settings-form" autocomplete="off" onsubmit="return false"></form>
      <div class="actions">
        <button type="button" id="generate" class="primary">Generate playlist</button>
      </div>
      <div id="validation" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="results-heading">
      <h2 id="results-heading">Playlist</h2>
      <div id="results"><p class="muted">Adjust the settings, then press <strong>Generate playlist</strong>.</p></div>
    </section>
  </main>

  <dialog id="library-dialog" class="wide" aria-label="Song library"></dialog>

  <datalist id="dl-raw"></datalist>
  <datalist id="dl-dances"></datalist>
  <datalist id="dl-tags"></datalist>
  <footer class="site-footer no-print">
    <a href="https://github.com/maxluo97/dance-social-playlist-generator" target="_blank" rel="noopener">Source code</a> · <a href="https://github.com/maxluo97/dance-social-playlist-generator/blob/main/LICENSE" target="_blank" rel="noopener">AGPL 3.0</a> · © 2026 Max Luo
  </footer>
</body>
</html>
